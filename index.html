<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuchar: El Eco de lo Eterno - Willi Arvi</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.88/dist/epub.min.js"></script>

    <style>
        :root { --bg: #121212; --sidebar: #1a1a1a; --text: #e0e0e0; --accent: #d4af37; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 300px; background: var(--sidebar); border-right: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
        #sidebar h2 { color: var(--accent); font-size: 1.2rem; padding: 20px; margin: 0; text-align: center; border-bottom: 1px solid #333; }
        #toc-container { flex: 1; overflow-y: auto; padding: 10px 0; }
        #toc-container a { display: block; padding: 12px 15px; color: #aaa; text-decoration: none; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.9rem;}
        #toc-container a:hover, #toc-container a.active { background: rgba(212,175,55,0.1); color: var(--accent); border-left: 4px solid var(--accent); }
        
        #main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
        #viewer { flex: 1; overflow-y: auto; overflow-x: hidden; color: #000; } 
        
        #audio-controls { background: #1e1e1e; border-top: 1px solid #333; padding: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 15px; justify-content: center; }
        button { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        select, input[type="range"] { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 5px; max-width: 200px; }
        .control-group { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 0.9rem; }
        
        /* Ocultar barra de scroll horizontal en el ePub */
        #viewer iframe { width: 100% !important; }

        @media (max-width: 768px) { 
            body { flex-direction: column; } 
            #sidebar { width: 100%; height: 180px; border-right: none; border-bottom: 1px solid #333; } 
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Índice</h2>
        <div id="toc-container"><p style="padding: 20px; color: #666; text-align: center;">Cargando...</p></div>
    </div>

    <div id="main-content">
        <div id="viewer"></div>
        
        <div id="audio-controls">
            <button id="btn-play" onclick="togglePlay()" disabled>▶️ Reproducir</button>
            <button id="btn-stop" onclick="stopReading()" disabled>⏹️ Detener</button>
            
            <div class="control-group">
                <label>Voz:</label>
                <select id="voice-select"></select>
            </div>
            
            <div class="control-group">
                <label>Velocidad:</label>
                <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>
    </div>

    <script>
        let book, rendition, isPlaying = false;
        let textParagraphs = [], currentIndex = 0;
        let synth = window.speechSynthesis;

        const viewer = document.getElementById('viewer');
        const tocContainer = document.getElementById('toc-container');
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const voiceSelect = document.getElementById('voice-select');
        const rateSlider = document.getElementById('rate-slider');

        // Inicializar ePub
        book = ePub("libro.epub"); 
        
        rendition = book.renderTo("viewer", { 
            width: "100%", 
            height: "100%", 
            flow: "scrolled-doc", 
            spread: "none" 
        });

        // Forzar el ancho del ePub para que no haya scroll horizontal
        rendition.hooks.content.register((contents) => {
            const body = contents.document.body;
            body.style.width = "100%";
            body.style.maxWidth = "100%";
            body.style.overflowX = "hidden";
            body.style.padding = "20px";
            body.style.boxSizing = "border-box";
            body.style.fontSize = "1.2rem";
        });

        book.ready.then(() => {
            return book.loaded.navigation;
        }).then((navigation) => {
            let tocHTML = '<ul>';
            navigation.toc.forEach(item => {
                tocHTML += `<li><a href="#" data-href="${item.href}">${item.label.trim()}</a></li>`;
            });
            tocHTML += '</ul>';
            tocContainer.innerHTML = tocHTML;
            
            const firstLink = tocContainer.querySelector('a');
            if(firstLink) {
                firstLink.classList.add('active');
                rendition.display(firstLink.getAttribute('data-href')).then(() => {
                    prepararLectura(); // Prepara el texto cuando la página ya se dibujó
                });
            }

            document.querySelectorAll('#toc-container a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.querySelectorAll('#toc-container a').forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    stopReading();
                    
                    const href = this.getAttribute('data-href');
                    // 1. Mostrar en pantalla
                    rendition.display(href).then(() => {
                        // 2. Una vez mostrado, extraer el texto de la pantalla
                        prepararLectura(); 
                    }); 
                });
            });
        });

        // NUEVA LÓGICA: Extraer el texto de lo que ya está dibujado en el iframe
        function prepararLectura() {
            btnPlay.disabled = true;
            btnPlay.innerHTML = "⏳ Cargando...";
            currentIndex = 0;
            textParagraphs = [];

            // Obtenemos los iframes internos que ha creado epub.js
            let contents = rendition.getContents();
            if (contents && contents.length > 0) {
                let doc = contents[0].document; // El documento HTML interno
                let rawText = doc.body.innerText || doc.body.textContent;
                
                if (rawText && rawText.trim() !== "") {
                    // Dividir en párrafos legibles
                    textParagraphs = rawText.split('\n').filter(p => p.trim().length > 0);
                    btnPlay.innerHTML = "▶️ Reproducir";
                    btnPlay.disabled = false;
                } else {
                    btnPlay.innerHTML = "❌ Sin texto";
                }
            } else {
                btnPlay.innerHTML = "❌ Error";
            }
        }

        // CARGAR TODAS LAS VOCES POSIBLES
        function populateVoiceList() {
            if (typeof speechSynthesis === 'undefined') return;
            const voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            
            // Ya NO filtramos solo español. Mostramos TODAS las voces que tenga el PC.
            voices.forEach((voice, i) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.value = i;
                voiceSelect.appendChild(option);
            });
            
            // Si hay voces, seleccionamos una en español por defecto
            const defaultVoice = voices.findIndex(v => v.lang.includes('es'));
            if(defaultVoice !== -1) voiceSelect.value = defaultVoice;
        }

        // Algunos navegadores tardan en cargar la lista de voces, así que forzamos la carga
        populateVoiceList();
        setTimeout(populateVoiceList, 500); 
        setTimeout(populateVoiceList, 1500);
        if (speechSynthesis.onvoiceschanged !== undefined) { 
            speechSynthesis.onvoiceschanged = populateVoiceList; 
        }

        // REPRODUCTOR
        function togglePlay() {
            if (synth.speaking && !synth.paused) { synth.pause(); btnPlay.innerHTML = "▶️ Reanudar"; }
            else if (synth.paused) { synth.resume(); btnPlay.innerHTML = "⏸️ Pausar"; }
            else { startReading(); }
        }

        function startReading() {
            if (textParagraphs.length === 0) return;
            readParagraph(currentIndex);
            isPlaying = true;
            btnPlay.innerHTML = "⏸️ Pausar";
            btnStop.disabled = false;
        }

        function readParagraph(index) {
            if (index >= textParagraphs.length) { stopReading(); return; }
            currentIndex = index;
            
            let utterance = new SpeechSynthesisUtterance(textParagraphs[index]);
            const voices = synth.getVoices();
            
            if (voiceSelect.value && voices[voiceSelect.value]) {
                utterance.voice = voices[voiceSelect.value];
            }
            utterance.rate = parseFloat(rateSlider.value);

            utterance.onend = () => { if (isPlaying) { readParagraph(currentIndex + 1); } };
            utterance.onerror = (e) => { if(e.error !== "interrupted" && e.error !== "canceled") { stopReading(); } };

            synth.speak(utterance);
        }

        function stopReading() {
            synth.cancel();
            isPlaying = false;
            currentIndex = 0;
            btnPlay.innerHTML = "▶️ Reproducir";
            btnStop.disabled = true;
        }
    </script>
</body>
</html>
