<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiolibros - Willi Arvi</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.88/dist/epub.min.js"></script>

    <style>
        :root { --bg: #121212; --sidebar: #1a1a1a; --text: #e0e0e0; --accent: #d4af37; --highlight: #f39c12; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Barra Superior (Selección de Libro) */
        #top-bar { background: #1a1a1a; padding: 10px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #333; z-index: 20; }
        #top-bar select { background: #333; color: white; border: 1px solid #555; padding: 10px; border-radius: 5px; font-size: 1rem; cursor: pointer; }

        /* Contenedor Principal */
        #app-container { display: flex; flex: 1; overflow: hidden; }

        /* Menú lateral */
        #sidebar { width: 320px; background: var(--sidebar); border-right: 1px solid #333; display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
        #sidebar h2 { color: var(--accent); font-size: 1.1rem; padding: 15px; margin: 0; text-align: center; border-bottom: 1px solid #333; }
        #toc-container a { display: block; padding: 12px 20px; color: #aaa; text-decoration: none; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.95rem;}
        #toc-container a:hover, #toc-container a.active { background: rgba(212,175,55,0.1); color: var(--accent); border-left: 4px solid var(--accent); }
        
        /* Área de lectura */
        #main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; position: relative; }
        #viewer { flex: 1; overflow-y: auto; overflow-x: hidden; color: #000; } 
        
        /* Controles inferiores */
        #audio-controls { background: #1e1e1e; border-top: 1px solid #333; padding: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 15px; justify-content: center; z-index: 10;}
        button { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        button:hover { background: var(--highlight); transform: scale(1.05); }
        button:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }
        select, input[type="range"] { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 5px; outline: none; }
        .control-group { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 0.9rem; }

        /* Responsive para celulares */
        @media (max-width: 768px) { 
            #app-container { flex-direction: column; }
            #sidebar { width: 100%; height: 180px; border-right: none; border-bottom: 1px solid #333; }
            #audio-controls { padding: 10px; gap: 10px; justify-content: space-around; }
            .control-group { flex-direction: column; align-items: flex-start; font-size: 0.8rem;}
            select { padding: 5px; font-size: 0.8rem; max-width: 130px;}
        }
    </style>
</head>
<body>

    <!-- Selector de Libro (Preparado para el futuro) -->
    <div id="top-bar">
        <label for="book-select" style="color:#aaa;">Elige un libro:</label>
        <select id="book-select" onchange="cambiarLibro(this.value)">
            <option value="libro.epub">El Eco de lo Eterno</option>
            <!-- Aquí agregarás tu segundo libro cuando esté listo: -->
            <!-- <option value="libro2.epub">Mi Segundo Libro</option> -->
        </select>
    </div>

    <!-- Contenedor de la App -->
    <div id="app-container">
        <div id="sidebar">
            <h2>Índice del Libro</h2>
            <div id="toc-container"><p style="padding: 20px; color: #666; text-align: center;">Cargando...</p></div>
        </div>

        <div id="main-content">
            <div id="viewer"></div>
            
            <div id="audio-controls">
                <button id="btn-play" onclick="togglePlay()" disabled>▶️ Reproducir</button>
                <button id="btn-stop" onclick="stopReading()" disabled>⏹️ Detener</button>
                
                <div class="control-group">
                    <label>Voz:</label>
                    <select id="voice-select" onchange="probarVoz()"></select>
                </div>
                
                <div class="control-group">
                    <label>Velocidad:</label>
                    <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1">
                </div>
            </div>
        </div>
    </div>

    <script>
        let book, rendition, isPlaying = false, isPaused = false;
        let textChunks = [], currentChunkIndex = 0;
        let synth = window.speechSynthesis;

        const viewer = document.getElementById('viewer');
        const tocContainer = document.getElementById('toc-container');
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const voiceSelect = document.getElementById('voice-select');
        const rateSlider = document.getElementById('rate-slider');

        // 1. INICIALIZAR EL LIBRO
        function cargarLibro(archivo) {
            stopReading();
            viewer.innerHTML = ""; // Limpiar pantalla
            tocContainer.innerHTML = '<p style="padding: 20px; color: #666;">Cargando índice...</p>';
            
            book = ePub(archivo); 
            
            // Configuración para evitar scroll horizontal y ajustar texto
            rendition = book.renderTo("viewer", { 
                width: "100%", height: "100%", flow: "scrolled-doc", spread: "none" 
            });

            // Inyectar CSS para forzar que el texto se adapte a la pantalla
            rendition.themes.default({
                'html, body': { 'overflow-x': 'hidden !important', 'width': '100% !important', 'box-sizing': 'border-box' },
                'p': { 'font-size': '1.2rem', 'line-height': '1.6' }
            });

            book.ready.then(() => {
                return book.loaded.navigation;
            }).then((navigation) => {
                let tocHTML = '<ul>';
                navigation.toc.forEach(item => {
                    tocHTML += `<li><a href="#" data-href="${item.href}" data-label="${item.label.trim()}">${item.label.trim()}</a></li>`;
                });
                tocHTML += '</ul>';
                tocContainer.innerHTML = tocHTML;
                
                // Cargar el primer capítulo automáticamente
                const firstLink = tocContainer.querySelector('a');
                if(firstLink) {
                    firstLink.classList.add('active');
                    const href = firstLink.getAttribute('data-href');
                    const label = firstLink.getAttribute('data-label');
                    rendition.display(href).then(() => prepararTexto(href, label));
                }

                // Eventos de clic en el índice
                document.querySelectorAll('#toc-container a').forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        document.querySelectorAll('#toc-container a').forEach(l => l.classList.remove('active'));
                        this.classList.add('active');
                        stopReading();
                        
                        const href = this.getAttribute('data-href');
                        const label = this.getAttribute('data-label');
                        
                        // Mostrar en pantalla y luego extraer el texto
                        rendition.display(href).then(() => prepararTexto(href, label)); 
                    });
                });
            }).catch(err => {
                tocContainer.innerHTML = `<p style="padding: 20px; color: red;">Error al cargar el libro. Revisa que el archivo exista.</p>`;
            });
        }

        // 2. EXTRAER EL TEXTO CORRECTO SEGÚN EL CAPÍTULO
        function prepararTexto(href, label) {
            btnPlay.disabled = true;
            btnPlay.innerHTML = "⏳ Cargando...";
            currentChunkIndex = 0;
            textChunks = [];

            // Esperar un momento a que el iframe se dibuje
            setTimeout(() => {
                let contents = rendition.getContents();
                if (!contents || contents.length === 0) return;

                let rawText = contents[0].document.body.innerText || contents[0].document.body.textContent;
                
                if (rawText && rawText.trim() !== "") {
                    // Dividimos el texto por oraciones para que el reproductor no se congele
                    // Busca puntos, signos de exclamación o interrogación seguidos de espacio
                    let oraciones = rawText.match(/[^.!?]+[.!?]+/g) || [rawText];
                    
                    // Si el ePub contiene todo el libro en una sola página, buscamos dónde inicia nuestro capítulo
                    let startIndex = 0;
                    if (label) {
                        let busqueda = label.substring(0, 15).toLowerCase(); // Usamos las primeras 15 letras
                        let indexEncontrado = oraciones.findIndex(o => o.toLowerCase().includes(busqueda));
                        if (indexEncontrado !== -1) startIndex = indexEncontrado;
                    }

                    // Guardamos solo las oraciones desde donde empieza el capítulo en adelante
                    textChunks = oraciones.slice(startIndex).map(s => s.trim()).filter(s => s.length > 0);
                    
                    btnPlay.innerHTML = "▶️ Reproducir";
                    btnPlay.disabled = false;
                } else {
                    btnPlay.innerHTML = "❌ Sin texto";
                }
            }, 300); // 300ms de espera para asegurar que el iframe cargó
        }

        // 3. REPRODUCTOR A PRUEBA DE FALLOS (El truco anti-congelamiento)
        function togglePlay() {
            if (isPlaying && !isPaused) {
                // PAUSAR
                isPaused = true;
                isPlaying = false;
                synth.cancel(); // Detiene la voz inmediatamente sin congelar el navegador
                btnPlay.innerHTML = "▶️ Reanudar";
            } else {
                // REPRODUCIR / REANUDAR
                isPaused = false;
                isPlaying = true;
                btnPlay.innerHTML = "⏸️ Pausar";
                btnStop.disabled = false;
                leerFragmento(currentChunkIndex);
            }
        }

        function leerFragmento(index) {
            if (index >= textChunks.length) { stopReading(); return; }
            
            currentChunkIndex = index;
            let utterance = new SpeechSynthesisUtterance(textChunks[index]);
            
            const voices = synth.getVoices();
            if (voiceSelect.value && voices[voiceSelect.value]) {
                utterance.voice = voices[voiceSelect.value];
            }
            utterance.rate = parseFloat(rateSlider.value);

            // Cuando termina esta oración, salta a la siguiente
            utterance.onend = () => { 
                if (isPlaying && !isPaused) { leerFragmento(currentChunkIndex + 1); } 
            };
            
            // Ignorar errores causados por pausar o detener
            utterance.onerror = (e) => { 
                if(e.error !== "interrupted" && e.error !== "canceled") { stopReading(); } 
            };

            synth.speak(utterance);
        }

        function stopReading() {
            synth.cancel();
            isPlaying = false;
            isPaused = false;
            currentChunkIndex = 0;
            btnPlay.innerHTML = "▶️ Reproducir";
            btnStop.disabled = true;
        }

        // 4. CONTROL DE VOCES (Solución para móviles)
        function cargarVoces() {
            if (typeof speechSynthesis === 'undefined') return;
            const voices = synth.getVoices();
            voiceSelect.innerHTML = '<option value="">Voz por defecto...</option>';
            
            voices.forEach((voice, i) => {
                const option = document.createElement('option');
                // Resaltamos las voces "Naturales" o de Google
                if (voice.name.includes('Google') || voice.name.includes('Natural')) {
                    option.textContent = `⭐ ${voice.name} (${voice.lang})`;
                } else {
                    option.textContent = `${voice.name} (${voice.lang})`;
                }
                option.value = i;
                voiceSelect.appendChild(option);
            });

            // Autoseleccionar la primera voz de Google o en español si existe
            let indexDefecto = voices.findIndex(v => v.name.includes('Google') && v.lang.includes('es'));
            if (indexDefecto === -1) indexDefecto = voices.findIndex(v => v.lang.includes('es'));
            if (indexDefecto !== -1) voiceSelect.value = indexDefecto;
        }

        function probarVoz() {
            synth.cancel(); // Detiene cualquier lectura actual
            let testUtterance = new SpeechSynthesisUtterance("Hola, así es como suena esta voz leyendo tu libro.");
            const voices = synth.getVoices();
            if (voiceSelect.value && voices[voiceSelect.value]) {
                testUtterance.voice = voices[voiceSelect.value];
            }
            synth.speak(testUtterance);
        }

        function cambiarLibro(archivo) {
            cargarLibro(archivo);
        }

        // INICIALIZACIÓN
        window.onload = function() {
            cargarLibro("libro.epub"); // Inicia el primer libro
            cargarVoces();
            setTimeout(cargarVoces, 500); 
            setTimeout(cargarVoces, 2000); // Algunos navegadores tardan en cargar las voces
            if (speechSynthesis.onvoiceschanged !== undefined) { 
                speechSynthesis.onvoiceschanged = cargarVoces; 
            }
        };
    </script>
</body>
</html>
