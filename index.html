<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audiolibros - Willi Arvi</title>
    
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.88/dist/epub.min.js"></script>

    <style>
        :root { --bg: #121212; --sidebar: #1a1a1a; --text: #e0e0e0; --accent: #d4af37; --highlight: #f39c12; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        
        /* Barra Superior */
        #top-bar { background: #1a1a1a; padding: 10px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #333; z-index: 20; flex-shrink: 0; }
        #top-bar select { background: #333; color: white; border: 1px solid #555; padding: 8px 12px; border-radius: 5px; font-size: 1rem; cursor: pointer; width: 100%; max-width: 300px; }

        /* Contenedor Principal */
        #app-container { display: flex; flex: 1; overflow: hidden; }

        /* Menú lateral (Pestañas) */
        #sidebar { width: 320px; background: var(--sidebar); border-right: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
        #sidebar-tabs { display: flex; border-bottom: 1px solid #333; }
        #sidebar-tabs button { flex: 1; background: #222; color: #888; border: none; padding: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #sidebar-tabs button.active { background: var(--sidebar); color: var(--accent); border-bottom: 2px solid var(--accent); }
        
        #toc-container, #bookmarks-container { flex: 1; overflow-y: auto; padding: 10px 0; display: none; }
        #toc-container.active-tab, #bookmarks-container.active-tab { display: block; }

        .toc-link, .bookmark-item { display: block; padding: 12px 20px; color: #aaa; text-decoration: none; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.95rem;}
        .toc-link:hover, .toc-link.active, .bookmark-item:hover { background: rgba(212,175,55,0.1); color: var(--accent); border-left: 4px solid var(--accent); }
        
        /* Estilo para el texto resaltado (Karaoke) */
        .tts-highlight {
            background-color: #ffeaa7 !important; /* Amarillo suave */
            color: #000 !important;
            border-radius: 3px;
            transition: background-color 0.3s ease;
        }
        
        /* Área de lectura */
        #main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; position: relative; }
        #viewer { flex: 1; overflow-y: auto; overflow-x: hidden; color: #000; } 
        
        /* Controles inferiores */
        #audio-controls { background: #1e1e1e; border-top: 1px solid #333; padding: 15px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 15px; z-index: 10; flex-shrink: 0; }
        button { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        button:hover { background: var(--highlight); transform: scale(1.05); }
        button:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }
        .btn-bookmark { background: #555; color: white; }
        .btn-bookmark:hover { background: #777; }

        select, input[type="range"] { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 5px; outline: none; }
        .control-group { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 0.9rem; }

        /* RESPONSIVE: Celulares */
        @media (max-width: 768px) { 
            #app-container { flex-direction: column; }
            #sidebar { width: 100%; height: 35dvh; border-right: none; border-bottom: 1px solid #333; }
            #viewer { flex: 1; height: 100%; }
            
            #audio-controls { padding: 10px; gap: 10px; flex-direction: column; justify-content: center; }
            .controls-row { display: flex; width: 100%; justify-content: space-around; align-items: center; gap: 10px; }
            .control-group { flex-direction: column; align-items: flex-start; font-size: 0.8rem; flex: 1; }
            select { width: 100%; padding: 5px; font-size: 0.85rem; }
            input[type="range"] { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <label for="book-select" style="color:#aaa;">Libro:</label>
        <select id="book-select" onchange="cambiarLibro(this.value)">
            <option value="libro.epub">El Eco de lo Eterno</option>
            <!-- Próximamente: <option value="libro2.epub">Mi Segundo Libro</option> -->
        </select>
    </div>

    <div id="app-container">
        <div id="sidebar">
            <div id="sidebar-tabs">
                <button id="tab-toc" class="active" onclick="switchTab('toc')">Índice</button>
                <button id="tab-bookmarks" onclick="switchTab('bookmarks')">Marcadores</button>
            </div>
            <div id="toc-container" class="active-tab"><p style="padding: 20px; color: #666; text-align: center;">Cargando...</p></div>
            <div id="bookmarks-container"><p style="padding: 20px; color: #666; text-align: center;">No hay marcadores guardados.</p></div>
        </div>

        <div id="main-content">
            <div id="viewer"></div>
            
            <div id="audio-controls">
                <div class="controls-row">
                    <button id="btn-play" onclick="togglePlay()" disabled style="flex:1;">▶️ Reproducir</button>
                    <button id="btn-stop" onclick="stopReading()" disabled style="flex:1;">⏹️ Detener</button>
                    <button class="btn-bookmark" onclick="guardarMarcador()" title="Guardar esta página">📍</button>
                </div>
                <div class="controls-row">
                    <div class="control-group">
                        <label>Voz:</label>
                        <select id="voice-select" onchange="cambiarVoz()"></select>
                    </div>
                    <div class="control-group">
                        <label>Velocidad:</label>
                        <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1" onchange="cambiarVelocidad()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let book, rendition, isPlaying = false, isPaused = false;
        let textChunks = [], currentChunkIndex = 0;
        let synth = window.speechSynthesis;

        const viewer = document.getElementById('viewer');
        const tocContainer = document.getElementById('toc-container');
        const bookmarksContainer = document.getElementById('bookmarks-container');
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const voiceSelect = document.getElementById('voice-select');
        const rateSlider = document.getElementById('rate-slider');

        // --- LÓGICA DE PESTAÑAS ---
        function switchTab(tab) {
            document.getElementById('tab-toc').classList.remove('active');
            document.getElementById('tab-bookmarks').classList.remove('active');
            tocContainer.classList.remove('active-tab');
            bookmarksContainer.classList.remove('active-tab');

            if(tab === 'toc') {
                document.getElementById('tab-toc').classList.add('active');
                tocContainer.classList.add('active-tab');
            } else {
                document.getElementById('tab-bookmarks').classList.add('active');
                bookmarksContainer.classList.add('active-tab');
            }
        }

        // --- INICIALIZAR LIBRO ---
        function cargarLibro(archivo) {
            stopReading();
            viewer.innerHTML = ""; 
            tocContainer.innerHTML = '<p style="padding: 20px; color: #666;">Cargando índice...</p>';
            
            book = ePub(archivo); 
            rendition = book.renderTo("viewer", { width: "100%", height: "100%", flow: "scrolled-doc", spread: "none" });

            // Inyectar CSS al ePub (Para el resaltado y evitar scroll horizontal)
            rendition.themes.default({
                'html, body': { 'overflow-x': 'hidden !important', 'width': '100% !important', 'box-sizing': 'border-box' },
                'p': { 'font-size': '1.2rem', 'line-height': '1.6' },
                '.tts-highlight': { 'background-color': '#ffeaa7 !important', 'color': '#000 !important', 'border-radius': '3px' }
            });

            book.ready.then(() => book.loaded.navigation).then((navigation) => {
                let tocHTML = '<ul>';
                navigation.toc.forEach(item => {
                    tocHTML += `<li><a href="#" class="toc-link" data-href="${item.href}" data-label="${item.label.trim()}">${item.label.trim()}</a></li>`;
                });
                tocHTML += '</ul>';
                tocContainer.innerHTML = tocHTML;
                
                // Cargar primer capítulo
                const firstLink = tocContainer.querySelector('a');
                if(firstLink) {
                    firstLink.classList.add('active');
                    const href = firstLink.getAttribute('data-href');
                    const label = firstLink.getAttribute('data-label');
                    rendition.display(href).then(() => prepararTexto(href, label));
                }

                // Eventos de clic en el índice
                document.querySelectorAll('.toc-link').forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        document.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
                        this.classList.add('active');
                        stopReading();
                        
                        const href = this.getAttribute('data-href');
                        const label = this.getAttribute('data-label');
                        rendition.display(href).then(() => prepararTexto(href, label)); 
                    });
                });
                
                cargarMarcadores(); // Cargar marcadores guardados
                
            }).catch(err => {
                tocContainer.innerHTML = `<p style="padding: 20px; color: red;">Error al cargar el libro.</p>`;
            });
        }

        // --- EXTRAER TEXTO ---
        function prepararTexto(href, label) {
            btnPlay.disabled = true;
            btnPlay.innerHTML = "⏳ Cargando...";
            currentChunkIndex = 0;
            textChunks = [];

            setTimeout(() => {
                let contents = rendition.getContents();
                if (!contents || contents.length === 0) return;

                let rawText = contents[0].document.body.innerText || contents[0].document.body.textContent;
                
                if (rawText && rawText.trim() !== "") {
                    let oraciones = rawText.match(/[^.!?]+[.!?]+/g) || [rawText];
                    let startIndex = 0;
                    
                    if (label) {
                        let busqueda = label.substring(0, 15).toLowerCase(); 
                        let indexEncontrado = oraciones.findIndex(o => o.toLowerCase().includes(busqueda));
                        if (indexEncontrado !== -1) startIndex = indexEncontrado;
                    }

                    textChunks = oraciones.slice(startIndex).map(s => s.trim()).filter(s => s.length > 0);
                    btnPlay.innerHTML = "▶️ Reproducir";
                    btnPlay.disabled = false;
                } else {
                    btnPlay.innerHTML = "❌ Sin texto";
                }
            }, 300); 
        }

        // --- REPRODUCTOR Y EFECTO KARAOKE ---
        function togglePlay() {
            if (isPlaying && !isPaused) {
                isPaused = true;
                isPlaying = false;
                synth.cancel(); 
                btnPlay.innerHTML = "▶️ Reanudar";
            } else {
                isPaused = false;
                isPlaying = true;
                btnPlay.innerHTML = "⏸️ Pausar";
                btnStop.disabled = false;
                leerFragmento(currentChunkIndex);
            }
        }

        function leerFragmento(index) {
            if (index >= textChunks.length) { stopReading(); return; }
            currentChunkIndex = index;
            
            // RESALTAR EN PANTALLA
            resaltarOracionActual(textChunks[index]);

            let utterance = new SpeechSynthesisUtterance(textChunks[index]);
            const voices = synth.getVoices();
            if (voiceSelect.value !== "" && voices[voiceSelect.value]) {
                utterance.voice = voices[voiceSelect.value];
            }
            utterance.rate = parseFloat(rateSlider.value);

            utterance.onend = () => { if (isPlaying && !isPaused) { leerFragmento(currentChunkIndex + 1); } };
            utterance.onerror = (e) => { if(e.error !== "interrupted" && e.error !== "canceled") { stopReading(); } };

            synth.speak(utterance);
        }

        // FUNCIÓN MÁGICA: RESALTAR TEXTO EN EL EPUB
        function resaltarOracionActual(oracion) {
            let contents = rendition.getContents();
            if (!contents || contents.length === 0) return;
            let doc = contents[0].document;

            // Quitar resaltados anteriores
            doc.querySelectorAll('.tts-highlight').forEach(el => el.classList.remove('tts-highlight'));

            // Buscar el párrafo que contiene esta oración
            let parrafos = doc.querySelectorAll('p');
            let busqueda = oracion.substring(0, 20).toLowerCase(); // Buscar por las primeras 20 letras

            for (let p of parrafos) {
                if (p.innerText.toLowerCase().includes(busqueda)) {
                    p.classList.add('tts-highlight');
                    // Hacer scroll automático para que el texto siempre esté visible
                    p.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
                    break;
                }
            }
        }

        function stopReading() {
            synth.cancel();
            isPlaying = false;
            isPaused = false;
            currentChunkIndex = 0;
            btnPlay.innerHTML = "▶️ Reproducir";
            btnStop.disabled = true;
            
            // Quitar resaltado al detener
            let contents = rendition.getContents();
            if (contents && contents.length > 0) {
                contents[0].document.querySelectorAll('.tts-highlight').forEach(el => el.classList.remove('tts-highlight'));
            }
        }

        // --- SISTEMA DE MARCADORES (CACHÉ) ---
        function guardarMarcador() {
            let loc = rendition.currentLocation();
            if(!loc || !loc.start) return;
            
            let cfi = loc.start.cfi;
            let nombrePagina = loc.start.href.split('/').pop().replace('.html', ''); // Nombre genérico
            // Buscar el capítulo al que pertenece
            let activeLabel = document.querySelector('.toc-link.active') ? document.querySelector('.toc-link.active').getAttribute('data-label') : "Marcador";

            let marcadores = JSON.parse(localStorage.getItem('mis_marcadores') || '[]');
            
            // Evitar duplicados exactos
            if(!marcadores.some(m => m.cfi === cfi)) {
                marcadores.push({ cfi: cfi, nombre: activeLabel, fecha: new Date().toLocaleDateString() });
                localStorage.setItem('mis_marcadores', JSON.stringify(marcadores));
                cargarMarcadores();
                alert("📍 Marcador guardado correctamente.");
            } else {
                alert("Ya tienes un marcador guardado en esta página.");
            }
        }

        function cargarMarcadores() {
            let marcadores = JSON.parse(localStorage.getItem('mis_marcadores') || '[]');
            if(marcadores.length === 0) {
                bookmarksContainer.innerHTML = '<p style="padding: 20px; color: #666; text-align: center;">No tienes marcadores guardados.</p>';
                return;
            }

            let html = '<ul>';
            marcadores.forEach((m, index) => {
                html += `<li><a href="#" class="bookmark-item" onclick="irAMarcador(event, '${m.cfi}')">
                    📍 ${m.nombre} <br><span style="font-size:0.75rem; color:#666;">${m.fecha}</span>
                </a></li>`;
            });
            html += '</ul>';
            bookmarksContainer.innerHTML = html;
        }

        function irAMarcador(e, cfi) {
            e.preventDefault();
            stopReading();
            rendition.display(cfi).then(() => {
                // Preparamos el texto desde el marcador
                let activeLabel = document.querySelector('.toc-link.active') ? document.querySelector('.toc-link.active').getAttribute('data-label') : "";
                prepararTexto(cfi, activeLabel);
            });
        }

        // --- VOCES Y VELOCIDAD ---
        function cargarVoces() {
            if (typeof speechSynthesis === 'undefined') return;
            const voices = synth.getVoices();
            if (voices.length === 0) return;

            voiceSelect.innerHTML = '<option value="">Voz por defecto</option>';
            let indexDefecto = 0;

            voices.forEach((voice, i) => {
                const option = document.createElement('option');
                if (voice.name.includes('Google') || voice.name.includes('Natural') || voice.name.includes('Siri')) {
                    option.textContent = `⭐ ${voice.name} (${voice.lang})`;
                    if(indexDefecto === 0) indexDefecto = i; 
                } else {
                    option.textContent = `${voice.name} (${voice.lang})`;
                }
                option.value = i;
                voiceSelect.appendChild(option);
            });
            voiceSelect.value = indexDefecto;
        }

        function cambiarVoz() {
            if (isPlaying) {
                synth.cancel(); 
                setTimeout(() => leerFragmento(currentChunkIndex), 100); 
            }
        }

        function cambiarVelocidad() {
            if (isPlaying) {
                synth.cancel();
                setTimeout(() => leerFragmento(currentChunkIndex), 100);
            }
        }

        function cambiarLibro(archivo) {
            cargarLibro(archivo);
        }

        // INICIO
        window.onload = function() {
            cargarLibro("libro.epub"); 
            cargarVoces();
            setTimeout(cargarVoces, 500); 
            setTimeout(cargarVoces, 1500); 
            if (speechSynthesis.onvoiceschanged !== undefined) { speechSynthesis.onvoiceschanged = cargarVoces; }
        };
    </script>
</body>
</html>
