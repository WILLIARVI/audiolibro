<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuchar: El Eco de lo Eterno - Willi Arvi</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --sidebar-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #d4af37;
            --highlight-color: #f39c12;
        }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        #sidebar { width: 320px; background-color: var(--sidebar-bg); border-right: 1px solid #333; display: flex; flex-direction: column; z-index: 10; }
        #sidebar h2 { color: var(--accent-color); font-size: 1.2rem; padding: 20px; margin: 0; text-align: center; border-bottom: 1px solid #333; text-transform: uppercase; }
        #toc-container { flex: 1; overflow-y: auto; padding: 10px 0; }
        #toc-container ul { list-style: none; padding: 0; margin: 0; }
        #toc-container a { display: block; padding: 15px 20px; color: #aaa; text-decoration: none; font-size: 0.95rem; transition: 0.3s; border-bottom: 1px solid #222; cursor: pointer; }
        #toc-container a:hover { background-color: rgba(212, 175, 55, 0.1); color: var(--accent-color); }
        #toc-container a.active { color: var(--accent-color); background-color: rgba(212, 175, 55, 0.15); border-left: 4px solid var(--accent-color); font-weight: bold; }
        #main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        #viewer { flex: 1; padding: 20px; overflow-y: hidden; }
        #audio-controls { background-color: #1e1e1e; border-top: 1px solid #333; padding: 15px 30px; display: flex; align-items: center; gap: 20px; z-index: 20; }
        button { background-color: var(--accent-color); color: #000; border: none; padding: 12px 24px; border-radius: 30px; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        button:hover { transform: scale(1.05); background-color: var(--highlight-color); }
        button:disabled { background-color: #555; color: #888; cursor: not-allowed; transform: none; }
        select, input[type="range"] { background-color: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 5px; outline: none; }
        .control-group { display: flex; align-items: center; gap: 10px; color: #aaa; font-size: 0.9rem; }
        @media (max-width: 768px) { body { flex-direction: column; } #sidebar { width: 100%; height: 200px; border-right: none; border-bottom: 1px solid #333; } #audio-controls { flex-wrap: wrap; padding: 10px; gap: 10px; justify-content: center; } }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Índice del Libro</h2>
        <div id="toc-container">
            <p style="padding: 20px; color: #666; text-align: center;">Cargando libro...</p>
        </div>
    </div>

    <div id="main-content">
        <div id="viewer"></div>
        <div id="audio-controls">
            <button id="btn-play" onclick="togglePlay()" disabled>▶️ Reproducir</button>
            <button id="btn-stop" onclick="stopReading()" disabled>⏹️ Detener</button>
            <div class="control-group"><label>Voz:</label><select id="voice-select"></select></div>
            <div class="control-group"><label>Velocidad:</label><input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1"></div>
        </div>
    </div>

    <script>
        let book, rendition, isPlaying = false, isPaused = false;
        let textParagraphs = [], currentParagraphIndex = 0;
        
        const viewer = document.getElementById('viewer');
        const tocContainer = document.getElementById('toc-container');
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const voiceSelect = document.getElementById('voice-select');
        const rateSlider = document.getElementById('rate-slider');

        // Inicialización del libro
        book = ePub("libro.epub"); 
        
        rendition = book.renderTo("viewer", { width: "100%", height: "100%", spread: "always" });

        // Lógica robusta para cargar el índice
        book.ready.then(() => {
            return book.loaded.navigation.catch(err => {
                console.warn("El ePub no tiene un índice válido, generando uno por páginas...");
                return { toc: [] }; // Retornamos un índice vacío para que no falle
            });
        }).then((navigation) => {
            let tocHTML = '<ul>';
            
            // Si el ePub tiene un índice nativo, lo usamos
            if (navigation.toc && navigation.toc.length > 0) {
                navigation.toc.forEach(item => {
                    tocHTML += `<li><a href="#" data-href="${item.href}">${item.label.trim()}</a></li>`;
                });
            } else {
                // Si falla, generamos un índice basado en las secciones internas (spine)
                book.spine.each((section, index) => {
                    // Evitamos mostrar la portada vacía o páginas en blanco si es posible
                    if(section.href) {
                        tocHTML += `<li><a href="#" data-href="${section.href}">Sección ${index + 1}</a></li>`;
                    }
                });
            }
            tocHTML += '</ul>';
            tocContainer.innerHTML = tocHTML;
            
            // Activar el primer capítulo por defecto
            const firstLink = tocContainer.querySelector('a');
            if(firstLink) {
                firstLink.classList.add('active');
                loadChapter(firstLink.getAttribute('data-href'));
                rendition.display(firstLink.getAttribute('data-href'));
            }

            // Agregar eventos a los enlaces del índice
            document.querySelectorAll('#toc-container a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.querySelectorAll('#toc-container a').forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    const targetHref = this.getAttribute('data-href');
                    stopReading();
                    rendition.display(targetHref);
                    loadChapter(targetHref);
                });
            });
        }).catch(err => {
            tocContainer.innerHTML = `<p style="padding:20px; color:red;">Error al cargar el ePub. Revisa que el archivo exista y no esté dañado.</p>`;
            console.error(err);
        });

        function loadChapter(href) {
            currentParagraphIndex = 0;
            textParagraphs = [];
            btnPlay.disabled = true;
            btnPlay.innerHTML = "⏳ Cargando texto...";

            book.load(href).then((doc) => {
                let rawText = doc.body.innerText;
                rawText = rawText.replace(/\n{3,}/g, '\n\n'); 
                textParagraphs = rawText.split('\n').filter(p => p.trim().length > 0);
                
                btnPlay.disabled = false;
                btnPlay.innerHTML = "▶️ Reproducir";
            }).catch(err => {
                console.error("Error al cargar texto:", err);
                btnPlay.innerHTML = "Error de texto";
            });
        }

        let synth = window.speechSynthesis;
        let currentUtterance = null;

        function populateVoiceList() {
            if (typeof speechSynthesis === 'undefined') return;
            const voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            voices.forEach((voice, i) => {
                if (voice.lang.includes('es')) {
                    const option = document.createElement('option');
                    option.textContent = `${voice.name} (${voice.lang})`;
                    option.value = i;
                    voiceSelect.appendChild(option);
                }
            });
        }
        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) { speechSynthesis.onvoiceschanged = populateVoiceList; }

        function togglePlay() {
            if (synth.speaking && !synth.paused) { pauseReading(); }
            else if (synth.paused) { resumeReading(); }
            else { startReading(); }
        }

        function startReading() {
            if (textParagraphs.length === 0) return;
            readParagraph(currentParagraphIndex);
            isPlaying = true;
            btnPlay.innerHTML = "⏸️ Pausar";
            btnStop.disabled = false;
        }

        function readParagraph(index) {
            if (index >= textParagraphs.length) { stopReading(); return; }
            currentParagraphIndex = index;
            currentUtterance = new SpeechSynthesisUtterance(textParagraphs[index]);
            
            const voices = synth.getVoices();
            if (voiceSelect.value && voices[voiceSelect.value]) {
                currentUtterance.voice = voices[voiceSelect.value];
            }
            currentUtterance.rate = parseFloat(rateSlider.value);
            currentUtterance.lang = 'es-ES';

            currentUtterance.onend = () => { if (isPlaying) { readParagraph(currentParagraphIndex + 1); } };
            currentUtterance.onerror = (e) => { 
                // Ignorar errores por pausar/detener bruscamente
                if(e.error !== "interrupted" && e.error !== "canceled") { stopReading(); } 
            };

            synth.speak(currentUtterance);
        }

        function pauseReading() { synth.pause(); isPaused = true; btnPlay.innerHTML = "▶️ Reanudar"; }
        function resumeReading() { synth.resume(); isPaused = false; btnPlay.innerHTML = "⏸️ Pausar"; }
        function stopReading() {
            synth.cancel();
            isPlaying = false; isPaused = false;
            currentParagraphIndex = 0;
            btnPlay.innerHTML = "▶️ Reproducir";
            btnStop.disabled = true;
        }
    </script>
</body>
</html>
